spring:
  application:
    name: ginko-payments

  r2dbc:
    url: r2dbc:h2:mem:///ginkopayments
    username: sa
    password:

  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

  webflux:
    base-path:

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  cors:
    allowed-origins: "http://localhost:8080"

server:
  port: 8080

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      providerService:
        base-config: default
      orderService:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0
    instances:
      providerService:
        base-config: default
      orderService:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
