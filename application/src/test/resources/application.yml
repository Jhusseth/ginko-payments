spring:
  r2dbc:
    url: r2dbc:h2:mem:///ginkopaymentstest
    username: sa
    password:

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 1
  retry:
    configs:
      default:
        max-attempts: 1
        wait-duration: 10ms
